<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#141218" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --md-primary: #d0bcff;
    --md-on-primary: #381e72;
    --md-primary-container: #4f378b;
    --md-on-primary-container: #eaddff;
    --md-secondary-container: #4a4458;
    --md-on-secondary-container: #e8def8;
    --md-error: #f2b8b5;
    --md-surface-lowest: #0f0d13;
    --md-surface-container: #211f26;
    --md-surface-high: #2b2930;
    --md-surface-highest: #36343b;
    --md-on-surface: #e6e0e9;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-outline-variant: #49454f;
    --elev-1: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
    --elev-3: 0 1px 3px rgba(0,0,0,.30), 0 4px 8px 3px rgba(0,0,0,.15);
    --state-hover: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
    --state-press: color-mix(in srgb, var(--md-on-surface) 12%, transparent);
    --ease: cubic-bezier(.2, 0, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--md-surface-lowest);
    font-family: Roboto, "Segoe UI", system-ui, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    letter-spacing: .01em;
    color: var(--md-on-surface);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .panel {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px 28px;
    border-radius: 28px;
    background: var(--md-surface-container);
    box-shadow: var(--elev-3);
  }
  .radar {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle, var(--md-outline) 0 2px, transparent 3px),
      repeating-radial-gradient(circle, transparent 0 10px, rgba(208,188,255,.28) 10px 11px),
      var(--md-surface-high);
    box-shadow: inset 0 0 0 2px var(--md-primary);
  }
  /* яркая кромка впереди по ходу вращения (по часовой), шлейф тускнеет позади */
  .radar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg,
      rgba(208,188,255,0) 0%,
      rgba(208,188,255,0) 60%,
      rgba(208,188,255,.7) 99.2%,
      rgba(208,188,255,1) 100%);
    animation: spin 2.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    margin-bottom: 4px;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0;
    text-align: center;
    color: var(--md-on-surface);
  }
  p.sub {
    margin-bottom: 24px;
    text-align: center;
    font-size: 14px;
    color: var(--md-on-surface-variant);
  }
  input[type="password"] {
    width: 100%;
    height: 52px;
    padding: 0 18px;
    background: var(--md-surface-high);
    border: 1px solid var(--md-outline);
    border-radius: 26px;
    color: var(--md-on-surface);
    font: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease);
  }
  input[type="password"]::placeholder { color: var(--md-outline); }
  input[type="password"]:hover { background: var(--md-surface-highest); }
  input[type="password"]:focus {
    border-color: var(--md-primary);
    box-shadow: 0 0 0 1px var(--md-primary);
  }
  button {
    width: 100%;
    height: 48px;
    margin-top: 14px;
    padding: 0 24px;
    background: var(--md-primary);
    border: 0;
    border-radius: 24px;
    color: var(--md-on-primary);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .1px;
    cursor: pointer;
    box-shadow: var(--elev-1);
    touch-action: manipulation;
    transition: background-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  button:hover:not(:disabled) {
    background-image: linear-gradient(rgba(56,30,114,.08), rgba(56,30,114,.08));
    box-shadow: var(--elev-3);
  }
  button:active:not(:disabled) { background-image: linear-gradient(rgba(56,30,114,.12), rgba(56,30,114,.12)); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }
  button:disabled { opacity: .38; cursor: default; box-shadow: none; }
  .error {
    margin-top: 14px;
    min-height: 18px;
    font-size: 13px;
    color: var(--md-error);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="radar"></div>
    <h1>Доступ ограничен</h1>
    <p class="sub">Введите пароль для входа</p>
    <form id="login-form" autocomplete="off">
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Пароль"
        autofocus
        required
      />
      <button type="submit" id="submit-btn">Войти</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submit-btn');
    const input = document.getElementById('password');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Проверка...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          window.location.replace('/');
          return;
        }

        errorEl.textContent = data.error || 'Ошибка входа.';
      } catch {
        errorEl.textContent = 'Не удалось связаться с сервером.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Войти';
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
